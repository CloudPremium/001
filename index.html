<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Rekomendasi Nama Gmail</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--line:#2c3038;--text:#f4f5f7;--muted:#a5aab4;--accent:#8ea5ff;--accent2:#c5d0ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#202438 0,#101114 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;padding:24px 14px}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;margin:12px 0 24px}
.badge{display:inline-block;border:1px solid #41475c;color:var(--accent2);border-radius:999px;padding:5px 10px;font-size:12px;letter-spacing:.08em}
h1{font-size:clamp(25px,5vw,36px);line-height:1.15;margin:14px 0 8px;letter-spacing:-.04em}
header p{color:var(--muted);margin:0}
.card{background:rgba(25,27,32,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0003}
label{display:block;font-size:13px;font-weight:650;margin:0 0 8px;color:#dfe2e9}
input,select{width:100%;min-height:46px;border:1px solid #383d47;border-radius:11px;background:#111318;color:var(--text);padding:11px 13px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8ea5ff22}
.fields{display:grid;grid-template-columns:1fr 180px;gap:12px}
.hint{color:var(--muted);font-size:12px;margin:8px 0 16px}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;min-height:43px;padding:10px 14px;font-weight:700}
.primary{width:100%;background:var(--accent);color:#101322}
.primary:hover{background:var(--accent2)}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}
h2{font-size:17px;margin:0}
#count{font-size:12px;color:var(--muted)}
.results{display:grid;gap:9px}
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;background:#17191e;border:1px solid var(--line);border-radius:12px;min-width:0}
.email{min-width:0;overflow-wrap:anywhere;font-weight:600}
.email small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
.copy{flex:0 0 auto;background:#292d36;color:#f2f4fa;min-height:36px;padding:7px 12px;font-size:12px}
.copy:hover{background:#383e4b}
#more{margin-top:12px;background:#242834;color:#e5e9f7;width:100%;border:1px solid #383e4b}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:16px 2px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#edf0ff;color:#141724;padding:10px 15px;border-radius:10px;font-size:13px;font-weight:700;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){body{padding:18px 11px}.card{padding:15px}.fields{grid-template-columns:1fr}.results-head{margin-top:18px}.result{padding:11px}.copy{padding:7px 10px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <span class="badge">GMAIL NAME GENERATOR</span>
  <h1>Rekomendasi Nama Gmail</h1>
  <p>By Adityaa Rahman</p>
</header>
<section class="card" aria-label="Generator nama Gmail">
  <div class="fields">
    <div>
      <label for="keyword">Kata utama atau nama</label>
      <input id="keyword" maxlength="40" placeholder="" autocomplete="off">
    </div>
    <div>
      <label for="category">Kategori</label>
      <select id="category">
        <option value="game">Game</option>
        <option value="moods">Moods</option>
        <option value="pribadi">Pribadi</option>
      </select>
    </div>
  </div>
  <p class="hint"></p>
  <button class="primary" id="generate">Buat Rekomendasi</button>
</section>
<div class="results-head">
  <h2>Hasil rekomendasi</h2><span id="count">Belum ada hasil</span>
</div>
<section class="results" id="results" aria-live="polite"></section>
<button id="more" hidden>Hasilkan variasi lainnya</button>
<p class="note"></p>
</main>
<div class="toast" id="toast" role="status">Nama disalin</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const input = $('keyword'), category = $('category'), results = $('results');
  const used = new Set();
  let total = 0;
  const wordSets = {
    game: ['play','gaming','gamer','pixel','quest','level','strike','rush','legend','shadow','phantom','nova','hunter','storm','blaze','vortex','nexus','clutch','arcade','skill','zone','prime','dragon','wolf','ace','reaper','orbit','spark'],
    moods: ['calm','soft','mellow','dream','cloud','serene','blue','sunny','quiet','honey','cozy','gentle','moon','starlit','velvet','bloom','mist','hope','dawn','midnight','lunar','happy','chill','glow','echo','wish','peace','aurora'],
    pribadi: ['official','hello','itsme','daily','real','notes','space','corner','journal','studio','simple','myday','connect','helloits','theone','personal','home','life','story','page','world','inbox','mail','online','id']
  };
  const tails = ['','x','id','hq','one','plus','hub','zone','daily','real','official','space','world','neo','pro','base','line','lab','works','point'];
  const digits = ['07','08','09','11','12','17','21','24','27','88','99','101','123','2024','2025','2026','07id','21x','88x','09real'];
  const clean = s => s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,24);
  function hashSeed(s) { let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0; }
  function shuffle(arr, seed) {
    const a=arr.slice(); let x=seed||1;
    for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }
  function makeCandidates(base, cat) {
    const words=shuffle(wordSets[cat], hashSeed(base+cat+Date.now()+Math.random()));
    const endings=shuffle(tails, hashSeed(base+Date.now()+Math.random()));
    const nums=shuffle(digits, hashSeed(cat+base+Math.random()));
    const candidates=[];
    // Pair the entered keyword with a changing pool of category-specific terms.
    words.forEach((w,i)=>{
      candidates.push(base+w, w+base, base+w+nums[i%nums.length], w+base+endings[i%endings.length]);
      if(cat==='pribadi') candidates.push(base+nums[i%nums.length], base+'_'+nums[i%nums.length]);
    });
    endings.forEach((t,i)=>{if(t)candidates.push(base+t, t+base, base+nums[i%nums.length]+t)});
    nums.forEach((n,i)=>candidates.push(base+n, base+words[i%words.length]+n));
    // Also vary order and compact compounds, while keeping valid username characters.
    words.slice(0,12).forEach((w,i)=>candidates.push(base+w+words[(i+5)%words.length], words[i]+base+words[(i+3)%words.length]));
    return shuffle([...new Set(candidates.map(clean).filter(x=>x.length>=6 && x.length<=30))], hashSeed(base+cat+Math.random()));
  }
  function showToast(msg) {
    $('toast').textContent=msg; $('toast').classList.add('show');
    clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>$('toast').classList.remove('show'),1500);
  }
  async function copyText(value) {
    try { await navigator.clipboard.writeText(value); showToast('Nama disalin'); }
    catch {
      const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
      const ok=document.execCommand('copy');t.remove();showToast(ok?'Nama disalin':'Salin manual: '+value);
    }
  }
  function addBatch() {
    const base=clean(input.value);
    if(!base){input.focus();input.setCustomValidity('Isi kata utama atau nama dulu.');input.reportValidity();input.setCustomValidity('');return;}
    const cat=category.value;
    let pool=makeCandidates(base,cat), added=0;
    // Retry with a fresh pool if the first pass overlaps existing results.
    for(let attempt=0;attempt<5 && added<12;attempt++){
      for(const candidate of pool){
        if(used.has(candidate)) continue;
        used.add(candidate);
        const row=document.createElement('article');row.className='result';
        const label=document.createElement('div');label.className='email';label.textContent=candidate+'@gmail.com';
        const sub=document.createElement('small');
        sub.textContent=cat==='game'?'Kategori Game':cat==='moods'?'Kategori Moods':'Kategori Pribadi';
        label.appendChild(sub);
        const btn=document.createElement('button');btn.className='copy';btn.textContent='Salin';
        btn.addEventListener('click',()=>copyText(candidate+'@gmail.com'));
        row.append(label,btn);results.appendChild(row);added++;total++;
        if(added>=12)break;
      }
      pool=makeCandidates(base,cat);
    }
    $('count').textContent=total+' rekomendasi';
    $('more').hidden=false;
    if(added===0) showToast('Ganti kata utama untuk variasi berbeda');
  }
  $('generate').addEventListener('click',()=>{used.clear();total=0;results.replaceChildren();addBatch();});
  $('more').addEventListener('click',addBatch);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')$('generate').click();});
})();
</script>
</body>
  </html>
